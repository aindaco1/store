name: Capture Production Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BACKUP_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-backup
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout consumer source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reviewed shared backup tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aindaco1/dust-wave-platform
          ref: e413c921b96b09f8139460d0b2596972a3ff7454
          path: recovery-tools
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install snapshot dependencies
        run: |
          npm ci
          npm ci --prefix worker
          sudo apt-get update
          sudo apt-get install -y age
          aws --version

      - name: Capture, encrypt, upload and verify
        run: >-
          python3 ../recovery-tools/scripts/capture-recovery-archive.py
          node scripts/store-backup.mjs --remote --kv-values --skip-build --acknowledge-sensitive=STORE_SENSITIVE_BACKUP --r2-objects --require-complete-r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          STORE_BACKUP_ENCRYPTION_RECIPIENT: ${{ secrets.RECOVERY_ENCRYPTION_RECIPIENT }}
          RECOVERY_IDENTITY_VARIABLE: STORE_BACKUP_AGE_IDENTITY
          RECOVERY_AGE_IDENTITY: ${{ secrets.RECOVERY_AGE_IDENTITY }}
          RECOVERY_ARCHIVE_URI: ${{ secrets.RECOVERY_ARCHIVE_URI }}
          RECOVERY_ARCHIVE_ENDPOINT: ${{ vars.STORE_RECOVERY_ARCHIVE_S3_ENDPOINT }}
          RECOVERY_ARCHIVE_ACCOUNT_ID: ${{ vars.STORE_RECOVERY_ARCHIVE_ACCOUNT_ID }}
          RECOVERY_ARCHIVE_NAME: store-backup.tar.gz.age
          RECOVERY_REQUIRE_R2: 'true'
          RECOVERY_EVIDENCE_OUTPUT: ${{ runner.temp }}/backup-verification.json
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.STORE_RECOVERY_ARCHIVE_REGION || 'auto' }}
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'

      - name: Retain sanitized backup verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-backup-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-verification.json
          if-no-files-found: warn
          retention-days: 90
