name: Provision Backup Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-credential-provisioning
  cancel-in-progress: false

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    environment: production-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed provisioning helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aindaco1/dust-wave-platform
          ref: e508ac9273bb6ee768d0541454f851c59dfff638
          persist-credentials: false

      - name: Install GitHub secret encryption library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-nacl

      - name: Seal backup-only credentials for the target environment
        run: /usr/bin/python3 scripts/seal-backup-credentials.py
        env:
          BACKUP_ENV_PUBLIC_KEY: ${{ vars.BACKUP_ENV_PUBLIC_KEY }}
          BACKUP_ENV_KEY_ID: ${{ vars.BACKUP_ENV_KEY_ID }}
          BACKUP_SEALED_OUTPUT: ${{ runner.temp }}/sealed-backup-credentials.json
          RECOVERY_AGE_IDENTITY: ${{ secrets.STORE_BACKUP_AGE_IDENTITY }}
          RECOVERY_ENCRYPTION_RECIPIENT: ${{ secrets.STORE_BACKUP_ENCRYPTION_RECIPIENT }}
          RECOVERY_ARCHIVE_URI: ${{ secrets.STORE_RECOVERY_ARCHIVE_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STORE_RECOVERY_ARCHIVE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORE_RECOVERY_ARCHIVE_SECRET_ACCESS_KEY }}

      - name: Retain GitHub-encrypted credential envelopes for installation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-backup-credentials-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-backup-credentials.json
          retention-days: 1
