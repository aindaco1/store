version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      root-development-dependencies:
        dependency-type: development
    # Upgrade these with the Platform pin; its build/release tools require exact versions.
    ignore:
      - dependency-name: esbuild
      - dependency-name: smol-toml

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      worker-development-dependencies:
        dependency-type: development
